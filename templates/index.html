<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Asistente Virtual</title>

<!-- =====================================================
     CONECTAR CSS
     ===================================================== -->

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

      <!-- =====================================================
     CONTENEDOR PRINCIPAL
     ===================================================== -->

<div class="chat-container">


    <!-- =================================================
         CABECERA
         ================================================= -->

    <header class="chat-header">

        <h2>
             Asistente virtual 🟢online
        </h2>

        <button
            class="btn-limpiar"
            id="btnLimpiar">

            Limpiar

        </button>

    </header>


    <!-- =================================================
         CAJA DE MENSAJES
         ================================================= -->

    <main
        class="chat-box"
        id="chatBox">

        {% for mensaje in historial %}

            <div
                class="msg {{ mensaje.remitente }}">

                {{ mensaje.mensaje }}

            </div>

        {% endfor %}

    </main>


    <!-- =================================================
         ÁREA DE INPUT
         ================================================= -->

    <form
        class="chat-input-area"
        id="chatForm">

        <input
            type="text"
            id="mensajeInput"
            placeholder="Escribe tu pregunta deportiva..."
            autocomplete="off"
            required>

        <button type="submit">
            Enviar
        </button>

    </form>


</div>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>

    // ====================================================
    // ELEMENTOS DEL DOM
    // ====================================================

    const chatBox =
        document.getElementById("chatBox");

    const chatForm =
        document.getElementById("chatForm");

    const mensajeInput =
        document.getElementById("mensajeInput");

    const btnLimpiar =
        document.getElementById("btnLimpiar");


    // ====================================================
    // BAJAR AUTOMÁTICAMENTE AL ÚLTIMO MENSAJE
    // ====================================================

    function scrollAlFinal() {

        chatBox.scrollTop =
            chatBox.scrollHeight;
    }


    // Ejecutar al cargar la página

    scrollAlFinal();


    // ====================================================
    // AGREGAR MENSAJE VISUALMENTE
    // ====================================================

    function agregarMensaje(remitente, mensaje) {

        const div =
            document.createElement("div");

        div.classList.add(
            "msg",
            remitente
        );

        div.textContent = mensaje;

        chatBox.appendChild(div);

        scrollAlFinal();
    }


    // ====================================================
    // ENVIAR MENSAJE
    // ====================================================

    chatForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const mensaje =
                mensajeInput.value.trim();


            // No enviar mensajes vacíos

            if (!mensaje) {
                return;
            }


            // Mostrar mensaje del usuario

            agregarMensaje(
                "usuario",
                mensaje
            );


            // Limpiar input

            mensajeInput.value = "";

            mensajeInput.disabled = true;


            // Mostrar cargando

            const loading =
                document.createElement("div");

            loading.classList.add(
                "msg",
                "bot",
                "loading"
            );

            loading.textContent =
                "...";

            chatBox.appendChild(loading);

            scrollAlFinal();


            try {

                // ========================================
                // ENVIAR AL SERVIDOR FLASK
                // ========================================

                const response =
                    await fetch("/enviar", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            mensaje: mensaje
                        })
                    });


                const data =
                    await response.json();


                // Eliminar "Pensando..."

                loading.remove();


                // ========================================
                // COMPROBAR ERROR
                // ========================================

                if (!response.ok) {

                    agregarMensaje(
                        "bot",
                        data.error ||
                        "Ocurrió un error."
                    );

                    return;
                }


                // ========================================
                // MOSTRAR RESPUESTA DE GEMINI
                // ========================================

                agregarMensaje(
                    "bot",
                    data.respuesta
                );


            } catch (error) {

                console.error(
                    "Error:",
                    error
                );

                loading.remove();

                agregarMensaje(
                    "bot",
                    "No se pudo conectar con el servidor."
                );

            } finally {

                mensajeInput.disabled = false;

                mensajeInput.focus();

            }

        }
    );


    // ====================================================
    // LIMPIAR CHAT
    // ====================================================

    btnLimpiar.addEventListener(
        "click",
        async function() {

            try {

                const response =
                    await fetch(
                        "/limpiar",
                        {
                            method: "POST"
                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    // Vaciar chat

                    chatBox.innerHTML = "";


                    // Agregar mensaje inicial

                    agregarMensaje(
                        "bot",
                        "Historial reiniciado. ¡Hola de nuevo! ¿En qué deporte quieres conversar?"
                    );

                } else {

                    alert(
                        data.error ||
                        "No se pudo limpiar el chat."
                    );

                }

            } catch (error) {

                console.error(
                    "Error:",
                    error
                );

                alert(
                    "No se pudo conectar con el servidor."
                );

            }

        }
    );

</script>
